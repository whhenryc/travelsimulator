<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>旅行模擬器</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9cc4e4;
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      .joystick {
        position: fixed;
        z-index: 5;
        width: 110px;
        height: 110px;
        margin: -55px 0 0 -55px;
        border-radius: 50%;
        background: rgb(255 255 255 / 18%);
        border: 2px solid rgb(255 255 255 / 45%);
        box-sizing: border-box;
        pointer-events: none;
        display: none;
      }
      .joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 48px;
        height: 48px;
        margin: -24px 0 0 -24px;
        border-radius: 50%;
        background: rgb(255 255 255 / 75%);
      }
      .joystick.running .joystick-knob {
        background: rgb(255 214 140 / 95%);
      }
      #attribution {
        position: fixed;
        right: 0;
        bottom: env(safe-area-inset-bottom, 0);
        z-index: 10;
        padding: 3px 8px;
        font: 12px/1.3 system-ui, sans-serif;
        color: #222;
        background: rgb(255 255 255 / 75%);
      }
      #attribution a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="attribution">
      © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
