<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>旅行模擬器</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9cc4e4;
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #attribution {
        position: fixed;
        right: 0;
        bottom: env(safe-area-inset-bottom, 0);
        z-index: 10;
        padding: 3px 8px;
        font: 12px/1.3 system-ui, sans-serif;
        color: #222;
        background: rgb(255 255 255 / 75%);
      }
      #attribution a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="attribution">
      © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
